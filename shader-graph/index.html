<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
    <title>Three Shader Graph Demo</title>
    <link rel="stylesheet" href="../assets/shader-graph.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #18181b;
        }

        .viewer-exit {
            position: fixed;
            top: 10px;
            right: 14px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(39, 39, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f4f4f5;
            font-size: 18px;
            line-height: 1;
            text-decoration: none;
            z-index: 50;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 160ms ease, transform 160ms ease, border-color 160ms ease;
        }

        .viewer-exit:hover {
            background: rgba(63, 63, 70, 0.95);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .viewer-exit:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <a class="viewer-exit" href="../index.html" aria-label="Back to portfolio">×</a>
    <script type="module" src="../assets/shader-graph.js"></script>
</body>

</html>
